[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mautonomy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mautonomy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
